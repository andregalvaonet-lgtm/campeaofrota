function hbars(items,fmt){const mx=Math.max(1,...items.map(i=>i.v)),W=520,bh=22,w_=W-320;return`<svg viewBox="0 0 ${W} ${items.length*(bh+8)+4}" style="width:100%;max-width:${W}px" role="img" aria-label="Gráfico de barras">${items.map((it,i)=>{const w=Math.max(2,w_*it.v/mx),y=i*(bh+8);return`<text x="0" y="${y+15}" font-size="12" fill="currentColor">${esc(it.l)}</text><rect x="150" y="${y}" width="${w}" height="${bh}" rx="4" fill="var(--rd)" style="transform-origin:150px 0;animation:growx .8s ease both"/><text x="${156+w}" y="${y+15}" font-size="12" fill="currentColor">${esc(fmt?fmt(it.v):it.v)}</text>`}).join('')}</svg>`}
const relHead=()=>`<h2>Relatórios</h2><p class="sub">Feche o mês, acompanhe o ano e veja o que vale mudar.</p><div class="row">${SUBR.map(c=>`<button class="c ${rt==c?'on':''}" onclick="rt='${c}';ed=null;draw()">${c}</button>`).join('')}</div>`;
function relExtra(){const MS=[...Array(12)].map((_,i)=>`${ry}-${String(i+1).padStart(2,'0')}`);
 if(rt=='Comparativo'){const MET={cb:['Combustível (R$)',d=>d.cbv,brl],man:['Manutenção (R$)',d=>d.man,brl],mul:['Multas (R$)',d=>d.mult.v,brl],lit:['Litros',d=>d.lit,v=>Math.round(v)+' L']},m=MET[cmet],V_=MS.map(x=>m[1](mesData(x)));
  return`<div class="row"><input type="number" value="${ry}" style="width:90px" onchange="ry=this.value;go_=false;draw()" aria-label="Ano"><select onchange="cmet=this.value;go_=false;draw()" aria-label="O que comparar">${Object.entries(MET).map(([k_,o])=>`<option value="${k_}" ${cmet==k_?'selected':''}>${o[0]}</option>`).join('')}</select></div><div class="card">${vbars(V_,MS.map(x=>x.slice(5)),m[2])}</div>`+tbl(['Mês',m[0]],MS.map((x,i)=>tr([x.slice(5)+'/'+ry,m[2](V_[i])])))}
 if(rt=='Orçamento'){const d=mesData(rm),R=[['cb','Combustível',d.cbv],['man','Manutenção',d.man],['mul','Multas',d.mult.v]];
  return`<div class="row"><input type="month" value="${rm}" onchange="rm=this.value;go_=false;draw()" aria-label="Mês"></div><p class="mu">Defina quanto pretende gastar por mês em cada item. O sistema compara com o que foi lançado.</p>`+tbl(['Item','Orçado (R$)','Realizado','Uso',''],R.map(([k_,l,v])=>{const o=+S.orc[k_]||0,pc=o>0?Math.round(v/o*100):0;return tr([l,`<input type="number" value="${o||''}" style="width:130px" onchange="S.orc['${k_}']=+this.value||0;save();draw()">`,brl(v),o>0?`<div class="pb"><i style="width:${Math.min(100,pc)}%;${pc>100?'background:var(--rd)':''}"></i></div> ${pc}%`:'—',o>0&&pc>100?'<span class="tag vc">acima</span>':''])}))}
 const by={};S.mul.forEach(m=>{const c=m.c||'Sem condutor';(by[c]=by[c]||{mu:0,mv:0,l:0,km:0});by[c].mu++;by[c].mv+=+m.v||0});S.comb.forEach(c=>{const q=c.q||'Sem nome';(by[q]=by[q]||{mu:0,mv:0,l:0,km:0});by[q].l+=+c.l||0});S.rast.forEach(r=>{const c=r.c||'Sem condutor';(by[c]=by[c]||{mu:0,mv:0,l:0,km:0});by[c].km+=kr(r)||0});
 return tbl(['Condutor / pessoa','Multas (qtd)','Multas (R$)','Litros abastecidos','Km rodados'],Object.entries(by).sort((a,b)=>b[1].mv-a[1].mv).map(([n,o])=>tr([esc(n),o.mu,brl(o.mv),Math.round(o.l*10)/10,o.km])),'Sem dados ainda.')}
{const _rel=V.rel;V.rel=()=>{if(['Comparativo','Orçamento','Condutores'].includes(rt))return relHead()+relExtra();let h=_rel();if(rt=='Mensal'){const done=S.chkm[rm]||[];h+=`<h3>Checklist do fechamento de ${rm.split('-').reverse().join('/')}</h3><div class="card">${CHK.map((c,i)=>`<label style="display:block"><input type="checkbox" ${done[i]?'checked':''} onchange="chkSet('${rm}',${i},this.checked)"> ${c}</label>`).join('')}</div>`}return h}}

/* ---- painéis ---- */
const ago=d=>{const s=String(d||'');let t=null;if(/^\d{4}-\d{2}-\d{2}/.test(s))t=new Date(s.slice(0,10)+'T00:00:00');else{const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)t=new Date(`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}T00:00:00`)}return t?Math.round((new Date(iso()+'T00:00:00')-t)/864e5):999};
const weekCard=()=>{const w=a=>a.filter(x=>ago(x.d)<=7&&ago(x.d)>=0);return`<h3>Resumo da semana</h3><div class="row">${k(w(S.arq).length,'arquivos enviados')}${k(w(S.mul).length,'multas lançadas')}${k(Math.round(sum(w(S.comb),'l'))+' L','combustível')}${k(w(S.os).length,'ordens de serviço')}${k(w(S.mov).length,'movimentações da frota')}</div>`};
const favCard=()=>{const F=D.filter(x=>S.fav[x.p]);return F.length?`<h3>Carros favoritos</h3>`+tbl(['Placa','Veículo','Condutor','Revisão','Rastreador','Débitos',''],F.map(x=>tr([`<b>${fp(x.p)}</b>`,esc(x.v),esc(x.c||'—'),`<span class="tag ${rev(x.p)[0]}">${rev(x.p)[1]}</span>`,tagOf(x.p),brl(x.tot),`<button class="c" onclick="fv='${x.p}';tab='ficha';go_=true;draw()">Abrir</button>`]))):''};
{const _d=V.dash;V.dash=()=>_d()+weekCard()+favCard()}
{const _e=V.exec;V.exec=()=>{const g=[{l:'Débitos (planilha)',v:sum(D.filter(ativo),'tot')},{l:'Manutenção',v:sum(S.ser,'v')+sum(S.os,'v')},{l:'Combustível',v:sum(S.cm,'v')||sum(S.comb,'v')},{l:'Multas em aberto',v:S.mul.filter(m=>m.s!='Paga').reduce((a,m)=>a+m.v,0)}];return _e()+`<h3>Para onde vai o dinheiro</h3><div class="card">${hbars(g,brl)}</div>`+weekCard()+favCard()}}
/* ---- rastreamento, rastreador, multas, manutenção, nada consta, contabilidade, empresas: arquivos de cada área ---- */
{const W=(t,cat,cats)=>{const o=V[t];V[t]=()=>o()+areaFiles(cat,cats)};W('rast','Rastreamento');W('trk','Rastreador');W('mul','Multa',['Multa','Nada Consta']);W('manut','Manutenção');W('nada','Nada Consta',['Nada Consta','Multa'])}
/* ---- administração ---- */
function quality(){const A=D.filter(ativo),Q=[['Sem Renavam',A.filter(x=>!x.r)],['Sem chassi',A.filter(x=>!x.ch)],['Sem condutor',A.filter(x=>!x.c)],['Sem empresa',A.filter(x=>!x.e||x.e=='—')],['Sem contrato',A.filter(x=>x.t=='SEM CONTRATO')],['Sem ano',A.filter(x=>!x.a)],['Total diferente da soma',D.filter(x=>Math.abs((+x.tot||0)-totOf(x))>.01)],['Sem km informado',A.filter(x=>S.km[x.p]==null)]];
 return`<h3>Qualidade dos dados</h3><p class="mu">Quanto mais completo o cadastro, melhores os avisos e relatórios.</p>`+tbl(['Verificação','Carros','Exemplos'],Q.map(([n,L])=>tr([n,L.length?`<span class="tag ${L.length>10?'vc':'pr'}">${L.length}</span>`:'<span class="tag ok">0</span>',L.slice(0,6).map(x=>`<a href="#" onclick="fv='${x.p}';tab='ficha';go_=true;draw();return false">${fp(x.p)}</a>`).join(' · ')])))}
const FN6={'André':['Pesquisa em todas as telas','Arquivos com Abrir e Baixar','Arquivos compartilhados entre os acessos','Verificador de qualidade dos dados','Backup em planilha com todas as abas','Configurações extras (cantos, menu, partículas)','Duplicar registros','Carros favoritos','Importações guardam o arquivo original','Resumo da semana'],
 'Marcos':['Gráfico de para onde vai o dinheiro','Resumo da semana','Comparativo mês a mês em gráfico','Orçamento x realizado','Ranking de condutores','Checklist de fechamento','Preço do litro por mês','Débitos de cada carro com o que pagar','Total a pagar no mês','Carros favoritos'],
 'Rogério':['Pendências de pagamento com marcar pago','Débito de cada carro por item','Combustível: total pago no mês','Rateio do combustível por carro','Preço médio do litro','Orçamento x realizado','Arquivos por empresa com Abrir e Baixar','Relatório de a pagar em planilha','Checklist de fechamento','Duplicar registros'],
 'Sérgio':['Enviar arquivo de rastreamento com nome, data, condutor e placa','Ler qualquer planilha enviada','Abrir e baixar os arquivos postados','Pesquisa em todas as telas','Arquivos de multa e Nada Consta guardados','Favoritos','Duplicar registros','Resumo da semana']};
{const _a=V.adm;V.adm=()=>{let h=_a();const nov=`<h3>Novidades desta versão</h3>`+tbl(['Pessoa','Funções novas'],Object.entries(FN6).map(e=>tr([e[0]+' ('+e[1].length+')',`<span style="white-space:normal;display:block;min-width:360px">${e[1].join(' · ')}</span>`])))+quality()+`<h3>Backup em planilha</h3><div class="row"><button class="b" onclick="backupXlsx()">Baixar backup (todas as abas)</button></div>`;return h.replace(/<h3>Novidades por pessoa[\s\S]*?(?=<h3>Aparência da empresa)/,nov)}}

const advCfg=()=>{const p=pf();return`<div class="card"><b>Aparência avançada</b><div class="fg">
 <label class="fl"><span>Fundo com partículas</span><select onchange="setPf('part',this.value=='1')"><option value="1" ${p.part!==false?'selected':''}>Ligado</option><option value="0" ${p.part===false?'selected':''}>Desligado</option></select></label>
 <label class="fl"><span>Quantidade de partículas: ${p.pd}</span><input type="range" min="20" max="120" step="10" value="${p.pd}" onchange="setPf('pd',+this.value)"></label>
 <label class="fl"><span>Cantos arredondados: ${p.rad}px</span><input type="range" min="0" max="18" value="${p.rad}" onchange="setPf('rad',+this.value)"></label>
 <label class="fl"><span>Cor do menu</span><select onchange="setPf('nav',this.value)">${Object.keys(NAVC).map(o=>`<option ${p.nav==o?'selected':''}>${o}</option>`).join('')}</select></label>
 <label class="fl"><span>Mostrar “Como funciona” nas telas</span><select onchange="setPf('ajuda',this.value=='1')"><option value="1" ${p.ajuda!==false?'selected':''}>Sim</option><option value="0" ${p.ajuda===false?'selected':''}>Não</option></select></label>
 <label class="fl"><span>Aviso ao entrar no sistema</span><select onchange="setPf('boas',this.value=='1')"><option value="1" ${p.boas!==false?'selected':''}>Sim</option><option value="0" ${p.boas===false?'selected':''}>Não</option></select></label></div></div>`};
{const _c=V.cfg;V.cfg=()=>_c()+advCfg()}
/* ---- plate: apelidos e importação inicial dos serviços ---- */
function guessP(title,name){const z=s=>String(s).toUpperCase().replace(/[^A-Z0-9 ]/g,' '),rx=/\b([A-Z]{3})\s?(\d[A-Z]\d{2}|\d{4})\b/,ok=p=>{p=ALIAS[p]||p;return D.some(x=>x.p==p)?p:''};
 for(const s of[title,name]){const m=z(s).match(rx);if(m){const p=ok(m[1]+m[2]);if(p)return{p}}}
 for(const s of[title,name]){const m=z(s).trim().match(/(\d[A-Z0-9]\d{2})\s*$/);if(m){const L=D.filter(x=>x.p.endsWith(m[1]));if(L.length==1)return{p:L[0].p};if(L.length>1){const w=z(s).trim().split(' ')[0],c=L.filter(x=>nz2(x.v).includes(nz2(w)));if(c.length==1)return{p:c[0].p}}}}
 const f=[title,name].map(s=>z(s).match(/\b([A-Z]{3})\s?(\d[A-Z]\d{2})\b/)).find(Boolean);return{p:'',np:f?(ALIAS[f[1]+f[2]]||f[1]+f[2]):''}}
function recalcKm(aff){aff.forEach(p=>{const L=S.ser.filter(s=>s.p==p&&s.km!=null);if(L.length){const mx=Math.max(...L.map(s=>s.km));if(S.km[p]==null||S.km[p]<mx)S.km[p]=mx;const oil=L.filter(s=>isOil(s.sv)).sort((a,b)=>String(b.d).localeCompare(String(a.d)));if(oil.length&&(S.ult[p]==null||S.ult[p]<oil[0].km))S.ult[p]=oil[0].km}})}
function migrateSer(){if(S.serv===1||!SER0.length)return;const seen=new Set(S.ser.map(s=>s.p+'|'+s.d+'|'+nz2(s.sv)+'|'+s.km+'|'+s.v)),aff=new Set();let n=0;SER0.forEach(r=>{const[p,d,sv,q,km,v,src]=r;if(!D.some(x=>x.p==p))return;const key=p+'|'+d+'|'+nz2(sv)+'|'+km+'|'+v;if(seen.has(key))return;seen.add(key);S.ser.push({id:Date.now()+n,p,d,sv,q,km,v,src,u:'Sistema'});n++;aff.add(p)});recalcKm([...aff]);aud(`Manutenção carregada da planilha de serviços: ${n} lançamentos em ${aff.size} carros`);S.serv=1;save()}
function dup(c,i){const o=Object.assign({},ARR(c)[i]);o.id=Date.now();if(o.d&&/^\d{4}-/.test(o.d))o.d=iso();S[c].unshift(o);aud('Duplicou '+TT[c],o.p);save();ed={c,i:0};go_=false;draw()}
seedC();migrate();migrateSer();caps().then(dbStart);

applyPrefs();draw();
